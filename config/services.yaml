parameters:
    stripe.secret_key: '%env(STRIPE_SK)%'
    stripe.publishable_key: '%env(STRIPE_PUBLISHABLE_KEY)%'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    # Corrected service definition for StripeService
    App\Service\StripeService:
        arguments:
            $secretKey: '%stripe.secret_key%'    # Injecting the Stripe secret key
            $publishableKey: '%stripe.publishable_key%'  # Injecting the Stripe publishable key

    # Other services definition
    App\Service\CommandeService:
        arguments:
            $requestStack: '@request_stack'
            $em: '@doctrine.orm.entity_manager'
            $livresRepo: '@App\Repository\LivresRepository'
